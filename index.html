<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xArm Robot Simulator (Web)</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #111;
            overflow: hidden;
        }
        #wasm-example {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            max-width: 100vw;
            max-height: 100vh;
        }
        /* Runtime error overlay: mirrors console errors into the DOM so
           failures are visible without opening devtools. */
        #err {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            max-width: 100vw;
            padding: 8px;
            color: #ff8888;
            background: rgba(0, 0, 0, 0.75);
            font: 12px monospace;
            white-space: pre-wrap;
            word-break: break-word;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- winit appends the WebGL canvas here (see WGPUGraphics::new) -->
    <div id="wasm-example"></div>
    <div id="err"></div>
    <script>
        // Surface runtime errors in the page itself (no devtools needed).
        const errBox = document.getElementById('err');
        const showErr = (msg) => {
            // wgpu's WebGL backend throws a benign control-flow exception
            // that it explicitly says isn't an error; don't scare users.
            if (msg.includes('Using exceptions for control flow')) return;
            errBox.textContent += msg + '\n';
        };
        window.addEventListener('error', (e) => showErr('ERROR: ' + (e.message || e.error)));
        window.addEventListener('unhandledrejection', (e) => showErr('REJECTION: ' + e.reason));
        const _ce = console.error.bind(console);
        console.error = (...a) => { showErr('console.error: ' + a.join(' ')); _ce(...a); };
        const _cw = console.warn.bind(console);
        console.warn = (...a) => { showErr('console.warn: ' + a.join(' ')); _cw(...a); };
    </script>
    <script type="module">
        // Generated by wasm-bindgen from the `urdf_arm` example.
        // See "Web deployment" in the README for build steps.
        import init from "./pkg/urdf_arm4.js";
        init();
    </script>
</body>

</html>
